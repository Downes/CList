<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorizing...</title>
    <script src="js/oauth-config.js?v=2026-11-23.5"></script>
    <script src="js/oauth-strategies.js"></script>
    <script src="js/oauth_start_workflow.js?v=2026-11-23.5"></script>
    <script src="js/oauth_callback_workflow.js?v=2026-11-23.5"></script>
    <script src="js/wordpress_auth_workflow.js?v=2026-11-23.6"></script>
    <script src="js/oauth-client.js?v=2026-11-23.5"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const msg = document.getElementById('msg');

            const params = new URLSearchParams(window.location.search);

            // HACK: Desktop-local bounce. WordPress requires HTTPS on success_url, so
            // wordpress.js sends https://clist.mooc.ca/callback.html?local_port=PORT.
            // We receive the credentials here and immediately redirect them to the local
            // launcher, which serves the real callback.html that processes them.
            // See the comment in js/wordpress.js for context on why this exists.
            try {
                const relay = wordPressCallbackRelay(window.location.search);
                if (relay) { window.location.replace(relay); return; }
                if (params.has('wp_state') || params.has('site_url') || params.has('password')) {
                    const result = completeWordPressAuthorization(window.location.search, {
                        prefix: window.CList.keys.OAUTH_STATE_PREFIX, now: Date.now,
                        read: key => sessionStorage.getItem(key), remove: key => sessionStorage.removeItem(key),
                        write: (key, value) => sessionStorage.setItem(key, value),
                    });
                    localStorage.setItem(window.CList.keys.OAUTH_CALLBACK_RESULT, JSON.stringify(result));
                    history.replaceState({}, document.title, window.location.pathname);
                    window.location.href = '/';
                    return;
                }
                // Standard OAuth callback (Mastodon etc.)
                const result = await OAuthClient.handleCallback();
                if (!result) {
                    msg.textContent = 'No authorization data found in URL.';
                    return;
                }
                localStorage.setItem(window.CList.keys.OAUTH_CALLBACK_RESULT, JSON.stringify(result));
                history.replaceState({}, document.title, window.location.pathname);
                window.location.href = '/';
            } catch (err) {
                history.replaceState({}, document.title, window.location.pathname);
                console.error('OAuth callback error:', err);
                msg.textContent = 'Authorization failed: ' + err.message;
            }
        });
    </script>
</head>
<body>
    <p id="msg">Completing authorization, please wait&hellip;</p>
    <p>If this page does not redirect automatically, <a href="/">return to CList</a>.</p>
</body>
</html>
