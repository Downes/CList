 document.getElementById('fixture-dialog')?.remove();const root=document.createElement('div');root.id='fixture-dialog';

};
window.dismissOnOutsideClick=()=>{};

window.collectionDependencies=session=>({session});

<script>

  button('Saved page').click();await tick();check(_draftItems.at(-1).url==='https://page.invalid'&&targets.pages.has('https://page.invalid'),'Existing page metadata retained for edit routing');
  cycle=true;await _showAddEntryFromExistingPicker(_draftItems,{id:'parent'},token,'key',()=>{},anchor,targets);
  const count=_draftItems.length;button('Child (collection)').click();await tick();check(_draftItems.length===count,'Cycle rejection keeps draft unchanged');
  document.getElementById('result').textContent='PASS: real collection opening/entry state, workflows, controllers and views; explicit Open/Insert/Cancel, exact references, captured identity/drafts, failed mount rollback, stale member/choice guards, local files, add-only nested imports and existing resource/cycle choices. '+checks+' checks. Editor APIs, HTTP, credentials, blobs and storage mocked; no external requests or file/storage writes.';
 }catch(error){console.error(error);document.getElementById('result').textContent='FAIL: '+error.stack;}
