<!doctype html>
<meta charset="utf-8">

<div id="write-title">Original title</div>
<div id="writeReferences"><p>Original reference</p></div>
<div id="post-result"></div>
<button id="final-post-button" class="btn">Publish</button>
<pre id="result">Checking publication requests…</pre>

<script src="../js/ui.js"></script>
<script>
window.CList.config = { flaskSiteUrl: 'https://original.invalid' };
window.CList.state = {
    publishing: {
        selectedAccountKeys: ['mastodon', 'wordpress'],
        busy: false
    },
    references: [{
        url: 'https://reference.invalid/original',
        metadata: { title: 'Original reference' }
    }]
};
window.CList.publishers = {};
window.CList.savers = [];
window.CList.loaders = [];
window.CList.schemas = {};
window.CList.ui.view.writeTitle =
    document.getElementById('write-title');
window.CList.ui.view.postResult =
    document.getElementById('post-result');

window.currentEditor = 'remote';
window.currentLoadedPage = null;
window.editorHandlers = {};
window.getReferences = () => window.CList.state.references;
window.parseAccountValue = account => JSON.parse(account.value);
window.removeHtml = html =>
    new DOMParser().parseFromString(html, 'text/html').body.textContent;

const errors = [];
window.showErrorModal = message => errors.push(message);

const accounts = [
    {
        key: 'mastodon',
        value: JSON.stringify({
            type: 'Mastodon',
            title: 'Short destination',
            permissions: 'w',
            maxlength: 140
        })
    },
    {
        key: 'wordpress',
        value: JSON.stringify({
            type: 'WordPress',
            title: 'Full destination',
            permissions: 'w'
        })
    }
];

const accountRequests = [];
window.getAccounts = async url => {
    accountRequests.push(url);
    return accounts;
};

const mentions = [];
window.sendWebMentions = (url, references) => {
    mentions.push({ url, references: structuredClone(references) });
};
</script>

<script src="../js/files.js"></script>
<script src="../js/publish.js"></script>

<script>
(async () => {
    const check = (condition, message) => {
        if (!condition) throw new Error(message);
    };

    try {
        const calls = [];
        const constructs = [];
        const fullURL = 'https://blog.invalid/article/123';
        const originalBody =
            '<p><strong>Original body</strong> ' +
            'Long article text. '.repeat(40) + '</p>';

        window.CList.publishers.WordPress = {
            publish: async (account, title, content, references) => {
                calls.push({
                    type: account.type,
                    title,
                    content,
                    references: structuredClone(references)
                });

                // A publisher must not alter another publisher's references.
                references[0].metadata.title = 'Publisher mutation';
                return fullURL;
            }
        };

        window.CList.publishers.Mastodon = {
            construct: (title, content) => {
                constructs.push({ title, content });
                return title + '\n' + removeHtml(content);
            },
            publish: async (account, title, content, references) => {
                calls.push({
                    type: account.type,
                    title,
                    content,
                    references: structuredClone(references)
                });
                return 'https://social.invalid/status/456';
            }
        };

        let finishContent;
        let editorReads = 0;

        editorHandlers.remote = {
            getContent: async () => {
                editorReads++;
                return await new Promise(resolve => {
                    finishContent = resolve;
                });
            }
        };

        const submission = postAll();

        check(
            editorReads === 1 && calls.length === 0,
            'PUB-R1: publishing awaits the active editor API'
        );

        // Change the live inputs while editor retrieval is pending.
        document.getElementById('write-title').innerText = 'Later title';
        document.getElementById('writeReferences').innerHTML =
            '<p>Later reference</p>';
        window.CList.state.references[0].metadata.title =
            'Later reference';
        window.CList.state.publishing.selectedAccountKeys = [];
        window.CList.config.flaskSiteUrl = 'https://later.invalid';

        finishContent(originalBody);
        await submission;

        check(
            calls.length === 2 &&
            calls[0].type === 'WordPress' &&
            calls[1].type === 'Mastodon',
            'PUB-R2: captured destinations retain full-first ordering'
        );

        const fullPost = new DOMParser().parseFromString(
            calls[0].content, 'text/html'
        );

        check(
            calls[0].title === 'Original title' &&
            fullPost.querySelector('#post-title')?.textContent ===
                'Original title' &&
            fullPost.querySelector('#post-content')?.innerHTML ===
                originalBody &&
            fullPost.querySelector('#post-references')?.textContent ===
                'Original reference',
            'PUB-R3: captured fields and retrieved HTML reach WordPress'
        );

        check(
            constructs.length === 1 &&
            constructs[0].title === 'Original title' &&
            constructs[0].content === calls[0].content &&
            calls[1].content.length <= 140 &&
            calls[1].content.includes('Original title') &&
            calls[1].content.includes(fullURL),
            'PUB-R4: destination formatting and short-post link are preserved'
        );

        check(
            calls.every(call =>
                call.references[0].metadata.title === 'Original reference'
            ) &&
            window.CList.state.references[0].metadata.title ===
                'Later reference',
            'PUB-R5: captured references are isolated from live and publisher changes'
        );

        check(
            accountRequests[0] === 'https://original.invalid' &&
            mentions.length === 1 &&
            mentions[0].url === fullURL &&
            mentions[0].references[0].metadata.title ===
                'Original reference',
            'PUB-R6: account lookup and WebMentions use captured inputs'
        );

        editorHandlers.remote = {
            getPostContent: async () => '<p>Publication representation</p>',
            getContent: () => {
                throw new Error('Native getter must not be used here');
            }
        };

        const specialized = await capturePublicationRequest();

        check(
            specialized.content.includes('Publication representation'),
            'PUB-R7: publication-specific editor content is preferred'
        );

        editorHandlers.remote = {
            getContent: async () => {
                throw new Error('Simulated editor API failure');
            }
        };

        const callsBeforeFailure = calls.length;
        const errorsBeforeFailure = errors.length;
        await postAll();

        check(
            calls.length === callsBeforeFailure &&
            errors.length === errorsBeforeFailure + 1 &&
            errors.at(-1).includes('Simulated editor API failure') &&
            !window.CList.state.publishing.busy &&
            !document.getElementById('final-post-button').disabled,
            'PUB-R8: editor retrieval failure stops publishing and clears busy state'
        );

        document.body.dataset.result = 'PASS';
        document.getElementById('result').textContent =
            'PASS: PUB-R1 through PUB-R8';
    } catch (error) {
        console.error(error);
        document.body.dataset.result = 'FAIL';
        document.getElementById('result').textContent = error.message;
    }
})();
</script>
