<!doctype html>
<meta charset="utf-8">
<title>CList LocalRSS reader regression</title>
<h1>LocalRSS guarded reader</h1>
<pre id="result">Checking LocalRSS reader...</pre>
<div id="left-content"></div><div id="selectedAccount"></div>
<div id="feed-menu"></div><div id="feed-container"></div>
<script>
window.CList = { defaults: { LOCALRSS: 'https://rss.invalid' }, schemas: {}, accountHooks: {}, config: { flaskSiteUrl: 'https://fixture.invalid' }, keys: { ACCESS_TOKEN: 'access_token' },
 state: { username: 'fixture' }, accounts: [], readers: {} };
let fixtureToken = 'fixture-token';
window.getSiteSpecificCookie = () => fixtureToken;
window.escapeHtml = value => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;');
window.parseAccountValue = record => JSON.parse(record.value);
window.isRegistered = () => true;
window.ensureAccountsLoaded = async () => window.CList.accounts;
window.openLeftInterface = panel => document.getElementById('left-content').replaceChildren(panel);
window.translationEnabled = false;
window.toggleTranslation = () => {};
window.fetch = () => { throw Error('Unexpected network request'); };
</script>
<script src="../js/ui.js"></script>
<script src="../js/reader-state.js"></script>
<script src="../js/reader-view.js"></script>
<script src="../js/reader.js"></script>
<script src="../js/localrss.js"></script>
<script src="../js/localrss_requests.js"></script>
<script src="../js/localrss_view.js"></script>
<script src="../js/localrss_reader.js"></script>
<script>
(async () => {
 const check = (value, label) => { if (!value) throw Error(label); };
 const response = data => ({ ok: true, json: async () => data });
 const waitUntil = async predicate => { const deadline = Date.now() + 2000; while (!predicate()) {
  if (Date.now() > deadline) throw Error('Fixture request did not start'); await new Promise(resolve => setTimeout(resolve, 0)); } };
 try {
  const requests = []; let finishA;
  window.audioFiles = []; window.generatePlaylistHTML = () => 'Playlist';
  window.getEncKey = async () => null; window.showLoader = () => {};
  window.showStatusMessage = () => {};
  window.makeListing = item => { const row = document.createElement('article'); row.textContent = item.feed + ': ' + item.title; return row; };
  window.createFeedHeader = title => { const el = document.createElement('h2'); el.textContent = title; return el; };
  _localrssProbeLocal = async () => false;
  window.fetch = async (url, options) => {
   requests.push({ url, options });
   if (url.includes('/api/stats')) return response({ has_audio_majority: false });
   if (url.includes('/api/feeds')) return response({ feeds: [{ id: 1, title: 'Captured feed', url: 'https://feed.invalid' }] });
   if (url.includes('db=A')) return new Promise(resolve => finishA = resolve);
   if (url.includes('offset=50')) return response([{ id: 51, title: 'Second page' }]);
   return response(Array.from({ length: 50 }, (_, id) => ({ id, title: 'B item ' + id, feed_title: 'B feed' })));
  };
  CList.accounts = ['A', 'B'].map(key => ({ key, value: JSON.stringify({ type: 'LOCALRSS', title: key,
   permissions: 'r', instance: key, database: key, serviceUrl: 'https://rss.invalid', hasAudio: false }) }));
  await playRead();
  const a = switchReaderAccount('A'); await waitUntil(() => finishA);
  await switchReaderAccount('B');
  finishA(response([{ id: 999, title: 'Obsolete A', audio_url: 'https://old.invalid/audio' }])); await a;
  check(!document.getElementById('feed-container').textContent.includes('Obsolete A'), 'Old account result did not render');
  check(audioFiles.length === 0, 'Old account audio did not enter playlist');
  localrssOptionsOverlay = () => {};
  await runReaderFeedAction(_readerSelection, 'Options');
  check(CList.state.reader.feedName === 'Unread', 'Options does not invalidate the displayed feed');
  const oldMore = document.getElementById('loadMoreButton'); check(oldMore, 'Full page offers Load more');
  await oldMore.onclick();
  check(CList.state.localrssReading.offset === 50, 'Pagination offset advances after success');
  check(document.querySelectorAll('#feed-container article').length === 51, 'Load more appends to existing items');
  await runReaderFeedAction(_readerSelection, 'Bookmarked');
  check(CList.state.localrssReading.filter === 'bookmarked', 'Bookmarked filter tracked in state');
  const count = requests.length; await oldMore.onclick(); check(requests.length === count, 'Old pagination callback is ignored');
  await runReaderFeedAction(_readerSelection, 'Feeds');
  check(document.getElementById('feed-container').textContent.includes('B: Captured feed'), 'Feed normalization uses captured account');
  await runReaderFeedAction(_readerSelection, 'Refresh');
  check(requests.at(-1).url.includes('/api/feeds'), 'Refresh preserves Feeds view');
  check(requests.filter(r => r.url.includes('/api/items')).every(r => r.options.headers.Authorization === 'Bearer fixture-token'), 'Requests carry captured authentication');
  check(!JSON.stringify(CList.state.reader).includes('fixture-token'), 'Reader state excludes token');
  document.body.dataset.result = 'PASS'; document.getElementById('result').textContent = 'PASS: real LocalRSS modules, account isolation, stale item/audio rejection, pagination, old callback guard, filters, Feeds and Refresh. All service requests mocked.';
 } catch (error) { console.error(error); document.body.dataset.result = 'FAIL'; document.getElementById('result').textContent = 'FAIL: ' + error.message; }
})();
</script>
