<!doctype html>
<meta charset="utf-8"><title>CList password confirmation regression</title>
<h1>Password confirmation</h1>
<p>Real confirmation workflow/controller/view. Session storage, key derivation, custom verification, action callbacks and modal shell mocked. No external requests or real storage writes; no destructive identity actions.</p>
<pre id="result">Checking confirmation…</pre>
<script>
let token='fixture-token',sourceCurrent=true,behavior={},actions=[],notices=[];
const expected=new Uint8Array(16).fill(1);let storedKey=btoa(String.fromCharCode(...expected));
window.CList={config:{flaskSiteUrl:'https://store.invalid'},keys:{USERNAME:'username',ACCESS_TOKEN:'access_token'},state:{username:'alice'},storage:{mode:'remote'},ui:{}};
window.getSiteSpecificCookie=(url,key)=>key==='username'?'alice':token;
Object.defineProperty(window,'sessionStorage',{value:{getItem:()=>storedKey},configurable:true});
window.deriveEncKey=async password=>behavior.derive?behavior.derive(password):crypto.subtle.importKey('raw',new Uint8Array(16).fill(password==='correct'?1:2),'AES-GCM',true,['encrypt']);
window.showStatusMessage=text=>notices.push(text);
window.showModal=root=>{document.getElementById('generic-modal')?.remove();const modal=document.createElement('div');modal.id='generic-modal';modal.appendChild(root);document.body.appendChild(modal);};
window.fetch=()=>{throw Error('Unexpected request');};
</script>
<script src="../js/password-confirmation-workflow.js?v=2026-11-20.9"></script><script src="../js/password-confirmation-view.js?v=2026-11-20.9"></script><script src="../js/password-confirmation.js?v=2026-11-20.9"></script>
<script>
(async()=>{let checks=0;const check=(ok,label)=>{if(!ok)throw Error(label);checks++;};const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
 const until=async fn=>{for(let i=0;i<40&&!fn();i++)await tick();if(!fn())throw Error('Async fixture did not settle');};
 const fields=()=>({modal:document.getElementById('generic-modal'),input:document.getElementById('confirm-pw-input'),ok:document.getElementById('confirm-pw-ok'),cancel:document.getElementById('confirm-pw-cancel'),error:document.getElementById('confirm-pw-error')});
 const open=(callback=password=>actions.push(password),options={})=>{confirmWithPassword('Confirm <strong>this test action</strong>',callback,options);return fields();};
 try{
 let dialog=open();check(dialog.modal.querySelector('strong')&&dialog.input.type==='password','Trusted HTML message and password field preserved');
 dialog.input.value='wrong';await dialog.ok.onclick();check(dialog.error.textContent==='Incorrect password.'&&!dialog.ok.disabled,'Incorrect password permits explicit retry');
 dialog.input.value='correct';await dialog.ok.onclick();check(actions.length===1&&actions[0]==='correct'&&!document.getElementById('generic-modal'),'Default verifier dispatches once and closes its modal');
 check(dialog.input.value===''&&!JSON.stringify(CList.state.passwordConfirmation).includes('correct'),'Password cleared and absent from state');await dialog.ok.onclick();check(actions.length===1,'Retained confirmed callback cannot dispatch twice');
 let release;dialog=open(undefined,{verify:()=>new Promise(resolve=>release=resolve),confirmLabel:'Import',confirmClass:'kv-save-btn'});dialog.input.value='import-secret';
 dialog.input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));await dialog.ok.onclick();check(dialog.ok.disabled&&dialog.input.disabled&&dialog.ok.textContent==='Import','Enter and click share pending lock and custom label');
 dialog.input.value='different';release(true);await until(()=>CList.state.passwordConfirmation.phase==='confirmed');check(actions.at(-1)==='import-secret','Custom verifier dispatches captured password rather than changed input');
 dialog=open(undefined,{verify:()=>new Promise(resolve=>release=resolve)});dialog.input.value='cancelled';const pendingCancel=dialog.ok.onclick();dialog.cancel.onclick();release(true);await pendingCancel;check(!actions.includes('cancelled')&&dialog.input.value==='','Cancel expires pending confirmation');
 dialog=open(undefined,{verify:()=>new Promise(resolve=>release=resolve)});dialog.input.value='replaced';const pendingOld=dialog.ok.onclick();const newer=open();release(true);await pendingOld;check(document.getElementById('generic-modal')===newer.modal&&!newer.ok.disabled&&!actions.includes('replaced'),'Old completion cannot close or alter replacement modal');newer.cancel.onclick();
 dialog=open();dialog.input.value='external-close';dialog.modal.remove();await tick();check(dialog.input.value==='','External modal closure clears detached password');await dialog.ok.onclick();check(!actions.includes('external-close'),'External closure rejects retained callback');
 for(const change of ['session','source','stored-key']){
  sourceCurrent=true;dialog=open(undefined,{verify:()=>new Promise(resolve=>release=resolve),isCurrent:()=>sourceCurrent});dialog.input.value='expired-'+change;const pending=dialog.ok.onclick();
  if(change==='session')token='other-token';if(change==='source')sourceCurrent=false;if(change==='stored-key')storedKey='new-key';release(true);await pending;
  check(!actions.includes('expired-'+change)&&dialog.error.textContent.includes('changed'),'Changed '+change+' expires verification');dialog.cancel.onclick();check(!document.getElementById('generic-modal'),'Expired dialog remains cancellable');token='fixture-token';sourceCurrent=true;storedKey=btoa(String.fromCharCode(...expected));
 }
 let tries=0;dialog=open(undefined,{verify:async()=>{if(++tries===1)throw Error('Verifier unavailable');return true;}});dialog.input.value='retry';await dialog.ok.onclick();check(dialog.error.textContent.includes('Could not verify')&&!dialog.ok.disabled,'Verification exception is visible and retryable');await dialog.ok.onclick();check(actions.includes('retry'),'Explicit verification retry succeeds');
 let failedActions=0;dialog=open(async()=>{failedActions++;throw Error('Mock action failure');},{verify:async()=>true});dialog.input.value='action-secret';await dialog.ok.onclick();await dialog.ok.onclick();check(failedActions===1&&notices.length===1&&CList.state.passwordConfirmation.phase==='action-failed','Confirmed async failure is reported without replay');
 check(!JSON.stringify(CList.state.passwordConfirmation).includes('action-secret'),'Failure summary excludes password');
 document.getElementById('result').textContent='PASS: real password confirmation workflow/controller/view, default and custom verifier contracts, captured passwords, Enter/click duplicate guards, Cancel/replaced/external modal rejection, session/source/key expiry, visible failures/explicit retry, single callback dispatch and secret-free state. '+checks+' checks. Session/key derivation/actions/modal shell mocked; no external requests or real storage writes.';document.body.dataset.result='PASS';
 }catch(error){console.error(error);document.getElementById('result').textContent='FAIL: '+error.stack;document.body.dataset.result='FAIL';}
})();
</script>
