<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CList Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Roboto, sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fafafa;
    }
    #chat-title {
      padding: 10px 14px;
      background: #ddd;
      font-weight: 500;
      border-bottom: 1px solid #ccc;
      flex-shrink: 0;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #chat-messages div {
      padding: 2px 0;
      word-break: break-word;
    }
    .chat-event {
      color: #888;
      font-style: italic;
      font-size: 12px;
      text-align: center !important;
      padding: 4px 0;
    }
    #chat-input-row {
      display: flex;
      padding: 8px 10px;
      gap: 6px;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
      background: #fff;
    }
    #messageInput {
      flex: 1;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-family: Roboto, sans-serif;
    }
    #sendButton {
      padding: 6px 14px;
      background: rgb(81, 177, 88);
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-family: Roboto, sans-serif;
      font-size: 14px;
    }
    #sendButton:hover { background: rgb(60, 150, 65); }
    #startDocButton { padding: 6px 10px; background: #888; color: white; border: none; border-radius: 3px; cursor: pointer; font-family: Roboto, sans-serif; font-size: 13px; }
    #startDocButton:hover { background: #666; }
  </style>
</head>
<body>
  <div id="chat-title">CList Chat</div>
  <div id="chat-messages">
    <div id="no-connection" class="chat-event">Connecting to CList…</div>
  </div>
  <div id="chat-input-row">
    <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off">
    <button id="sendButton">Send</button>
    <button id="startDocButton" title="Start a shared document from this discussion">Start doc</button>
  </div>

  <script src="js/dynamicp2p_popup_view.js?v=2026-11-21.6"></script>
  <script src="js/dynamicp2p_popup_client.js?v=2026-11-21.6"></script>
  <script>startP2pPopupClient();</script>
</body>
</html>
