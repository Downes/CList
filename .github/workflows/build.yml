name: Build and Release CList

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Download mkcert
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/FiloSottile/mkcert/releases/latest'
          $ver = $release.tag_name
          $url = "https://github.com/FiloSottile/mkcert/releases/download/$ver/mkcert-$ver-windows-amd64.exe"
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri $url -OutFile tools\mkcert.exe

      - name: Build
        shell: pwsh
        run: python -m PyInstaller
              --onefile
              --noconsole
              --name "CList"
              --add-data "index.html;."
              --add-data "about.html;."
              --add-data "callback.html;."
              --add-data "redirect.html;."
              --add-data "chat.html;."
              --add-data "chat-popup.html;."
              --add-data "desktop.html;."
              --add-data "desktop-how-it-works.html;."
              --add-data "js;js"
              --add-data "css;css"
              --add-data "assets;assets"
              --add-data "images;images"
              --add-data "tools/mkcert.exe;tools"
              launcher.py

      - uses: actions/upload-artifact@v7
        with:
          name: CList-windows
          path: dist/CList.exe

      - name: Install LocalRSS build deps
        run: pip install -r requirements-localrss.txt

      - name: Build (with LocalRSS)
        shell: pwsh
        run: .\build-windows.ps1 -WithLocalRSS

      - uses: actions/upload-artifact@v7
        with:
          name: CList-LocalRSS-windows
          path: dist/CList-LocalRSS.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: bash build-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: CList-macos
          path: dist/CList

      - name: Install LocalRSS build deps
        run: pip install -r requirements-localrss.txt

      - name: Build (with LocalRSS)
        run: bash build-macos.sh --with-localrss

      - uses: actions/upload-artifact@v7
        with:
          name: CList-LocalRSS-macos
          path: dist/CList-LocalRSS

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: bash build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: CList-linux
          path: dist/clist

      - name: Install LocalRSS build deps
        run: pip install -r requirements-localrss.txt

      - name: Build (with LocalRSS)
        run: bash build-linux.sh --with-localrss

      - uses: actions/upload-artifact@v7
        with:
          name: CList-LocalRSS-linux
          path: dist/clist-localrss

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute tag and title
        id: meta
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          DATE=$(date +'%Y-%m-%d')
          TAG="v${VERSION}-${DATE}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=CList v${VERSION} — ${DATE}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          name: CList-windows
          path: release-assets/

      - uses: actions/download-artifact@v8
        with:
          name: CList-LocalRSS-windows
          path: release-assets/

      - uses: actions/download-artifact@v8
        with:
          name: CList-macos
          path: release-assets/

      - uses: actions/download-artifact@v8
        with:
          name: CList-LocalRSS-macos
          path: release-assets/

      - uses: actions/download-artifact@v8
        with:
          name: CList-linux
          path: release-assets/

      - uses: actions/download-artifact@v8
        with:
          name: CList-LocalRSS-linux
          path: release-assets/

      - name: Rename binaries
        run: |
          mv release-assets/CList release-assets/CList-macos
          mv release-assets/clist release-assets/CList-linux
          mv release-assets/CList-LocalRSS release-assets/CList-LocalRSS-macos
          mv release-assets/clist-localrss release-assets/CList-LocalRSS-linux
          chmod +x release-assets/CList-macos release-assets/CList-linux release-assets/CList-LocalRSS-macos release-assets/CList-LocalRSS-linux

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            **CList v${{ steps.meta.outputs.version }}** — built ${{ steps.meta.outputs.date }}

            | Platform | Plain | With LocalRSS bundled |
            |----------|-------|------------------------|
            | Windows  | `CList.exe` | `CList-LocalRSS.exe` |
            | macOS    | `CList-macos` | `CList-LocalRSS-macos` |
            | Linux    | `CList-linux` | `CList-LocalRSS-linux` |

            The "With LocalRSS bundled" builds include a local LocalRSS backend that starts automatically —
            no separate install needed. Use the plain build if you already run your own LocalRSS, or don't
            use it.

            Built from commit ${{ github.sha }}.
          files: release-assets/*
          make_latest: true
