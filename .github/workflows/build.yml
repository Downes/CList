name: Build CList

on:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: bash build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CList-macos
          path: dist/CList

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: bash build-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CList-linux
          path: dist/clist
